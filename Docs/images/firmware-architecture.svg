<svg xmlns="http://www.w3.org/2000/svg" width="560" height="844" font-family="Helvetica, Arial, sans-serif" viewBox="0 0 560 844" role="img" aria-label="Each sample feeds into 2 paths: a lasting event record for storing data in persistent storage and a live stream for real-time plotting" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b6b6b"></path></marker><marker id="live-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e07b1a"></path></marker><marker id="rec-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2e9b57"></path></marker></defs><text font-size="15" font-weight="600" fill="#1a1a1a"><tspan x="12" y="26">Each sample feeds into 2 paths:</tspan></text><text font-size="15" fill="#1a1a1a"><tspan x="16" y="46">• a lasting event record for storing data in persistent storage</tspan><tspan x="16" y="66">• a live stream for real-time plotting</tspan></text><g transform="translate(0 20)"><g><rect x="120" y="72" width="320" height="48" rx="8" fill="none" fill-opacity="1" stroke="#6b6b6b" stroke-width="1.25"></rect><text x="280" y="101" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">H3LIS331DL at 1 kHz + three FSRs</text></g><g><rect x="12" y="144" width="536" height="372" rx="8" fill="none" stroke="#d4d4d4" stroke-width="1.25" stroke-dasharray="4 4"></rect><text x="28" y="168" font-size="14" font-weight="600" fill="#1a1a1a">Core 1 · loop(), no delay</text><text x="28" y="186" font-size="12" fill="#5f5f5f">plus one serial command per pass</text></g><g><rect x="130" y="200" width="300" height="96" rx="8" fill="#2a6fdb" fill-opacity="0.12" stroke="#2a6fdb" stroke-width="2"></rect><text x="280" y="224" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Read a sample</text><text x="280" y="242" text-anchor="middle" fill="#1a1a1a">poll INT1 (count impacts)</text><text x="280" y="260" text-anchor="middle" fill="#1a1a1a">and STATUS_REG</text><text x="280" y="278" text-anchor="middle" fill="#1a1a1a">on ZYXDA: 6-byte burst + 3 ADC reads</text></g><g><rect x="28" y="336" width="240" height="164" rx="8" fill="#e07b1a" fill-opacity="0.06" stroke="#e07b1a" stroke-width="2"></rect><text x="148" y="360" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Live stream</text><text x="148" y="380" text-anchor="middle" font-weight="600" fill="#1a1a1a">Why: watch samples live</text><line x1="44" x2="252" y1="392" y2="392" stroke="#d4d4d4"></line><text x="148" y="412" text-anchor="middle" fill="#5f5f5f">only in stream mode</text><text x="148" y="430" text-anchor="middle" fill="#1a1a1a">keeps max |a| of N samples</text><text x="148" y="448" text-anchor="middle" fill="#1a1a1a">and the min of each FSR</text><text x="148" y="466" text-anchor="middle" fill="#1a1a1a">10 samples → 133-byte packet</text><text x="148" y="484" text-anchor="middle" fill="#1a1a1a">100 packets/s at full rate</text></g><g><rect x="292" y="336" width="240" height="164" rx="8" fill="#2e9b57" fill-opacity="0.06" stroke="#2e9b57" stroke-width="2"></rect><text x="412" y="360" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Event recording</text><text x="412" y="380" text-anchor="middle" font-weight="600" fill="#1a1a1a">Why: keep strong events</text><line x1="308" x2="516" y1="392" y2="392" stroke="#d4d4d4"></line><text x="412" y="412" text-anchor="middle" fill="#5f5f5f">always on, every 100 ms</text><text x="412" y="430" text-anchor="middle" fill="#1a1a1a">row if any axis ≥ 100 g</text><text x="412" y="448" text-anchor="middle" fill="#1a1a1a">or FSR 1 ≤ 2030 counts</text><text x="412" y="466" text-anchor="middle" fill="#1a1a1a">printed in text mode</text><text x="412" y="484" text-anchor="middle" fill="#1a1a1a">buffered in 2 × 4 KB RAM</text></g><g><rect x="12" y="572" width="536" height="148" rx="8" fill="none" stroke="#d4d4d4" stroke-width="1.25" stroke-dasharray="4 4"></rect><text x="280" y="596" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Core 0 · FreeRTOS tasks</text><text x="280" y="614" text-anchor="middle" font-size="12" fill="#5f5f5f">priority 1</text></g><g><rect x="28" y="628" width="240" height="76" rx="8" fill="#e07b1a" fill-opacity="0.06" stroke="#e07b1a" stroke-width="2"></rect><text x="148" y="652" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">streamTask</text><text x="148" y="670" text-anchor="middle" fill="#1a1a1a">send packets over USB</text><text x="148" y="688" text-anchor="middle" fill="#1a1a1a">reset queue after 50 ms stall</text></g><g><rect x="292" y="628" width="240" height="76" rx="8" fill="#2e9b57" fill-opacity="0.06" stroke="#2e9b57" stroke-width="2"></rect><text x="412" y="652" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">logTask</text><text x="412" y="670" text-anchor="middle" fill="#1a1a1a">append to newest segment</text><text x="412" y="688" text-anchor="middle" fill="#1a1a1a">drop oldest when full</text></g><g><rect x="28" y="752" width="240" height="48" rx="8" fill="#e07b1a" fill-opacity="0.06" stroke="#e07b1a" stroke-width="2"></rect><text x="148" y="781" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">USB → computer, live plot</text></g><g><rect x="292" y="752" width="240" height="48" rx="8" fill="#2e9b57" fill-opacity="0.06" stroke="#2e9b57" stroke-width="2"></rect><text x="412" y="781" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Flash log, about 1.5 MB</text></g><g fill="none" stroke-width="1.5"><path d="M280 120V200" stroke="#6b6b6b" marker-end="url(#arch-arrow)"></path><path d="M230 296V316H148V336" stroke="#e07b1a" marker-end="url(#live-arrow)"></path><path d="M148 500V628" stroke="#e07b1a" marker-end="url(#live-arrow)"></path><path d="M148 704V752" stroke="#e07b1a" marker-end="url(#live-arrow)"></path><path d="M330 296V316H412V336" stroke="#2e9b57" marker-end="url(#rec-arrow)"></path><path d="M412 500V628" stroke="#2e9b57" marker-end="url(#rec-arrow)"></path><path d="M412 704V752" stroke="#2e9b57" marker-end="url(#rec-arrow)"></path></g><text font-size="12" fill="#5f5f5f"><tspan x="156" y="540">streamQueue,</tspan><tspan x="156" y="556">32 packets</tspan></text><text font-size="12" fill="#5f5f5f"><tspan x="420" y="540">logQueue,</tspan><tspan x="420" y="556">after 1 s quiet</tspan></text></g></svg>