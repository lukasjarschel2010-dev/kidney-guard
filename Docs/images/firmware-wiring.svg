 x="360" y="606" font-size="12" fill="#5f5f5f">GND</text></g><text font-size="12" fill="#5f5f5f"><tspan x="24" y="638">Each FSR pin reads about 4095 at rest and falls when pressed.</tspan><tspan x="24" y="656">All three feed the log and the squeeze check.</tspan></text></svg>