<svg xmlns="http://www.w3.org/2000/svg" width="560" height="674" font-family="Helvetica, Arial, sans-serif" viewBox="0 0 560 674" role="img" aria-label="The FSR and pull-up form a voltage divider" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="32" font-size="16" font-weight="600" fill="#1a1a1a">The FSR and pull-up form a voltage divider</text><g fill="none" stroke="#6b6b6b" stroke-width="1.25"><path d="M120 90V110M120 170V230M120 290V305M120 200H200"></path><rect x="100" y="110" width="40" height="60" rx="4"></rect><rect x="100" y="230" width="40" height="60" rx="4"></rect><path d="M106 305H134M110 309H130M114 313H126"></path><circle cx="120" cy="200" r="3.5" fill="#6b6b6b"></circle><circle cx="200" cy="200" r="3" fill="#6b6b6b"></circle><circle cx="120" cy="90" r="3" fill="#6b6b6b"></circle></g><text x="120" y="80" text-anchor="middle" fill="#1a1a1a">3.3 V</text><text x="152" y="138" font-weight="600" fill="#1a1a1a">R_pullup</text><text x="152" y="156" font-size="12" fill="#5f5f5f">4.7 kΩ</text><text x="208" y="204" font-weight="600" fill="#1a1a1a">ADC pin (D8)</text><text x="152" y="258" font-weight="600" fill="#1a1a1a">R_FSR</text><text x="152" y="276" font-size="12" fill="#5f5f5f">falls when pressed</text><g font-size="12"><text x="300" y="112" fill="#1a1a1a">No press: R_FSR is very high</text><text x="300" y="130" fill="#5f5f5f">pin near 3.3 V, count near 4095</text><text x="300" y="166" fill="#1a1a1a">Pressing lowers R_FSR</text><text x="300" y="184" fill="#5f5f5f">pin voltage and count fall</text><text x="300" y="220" fill="#1a1a1a">R_FSR = R_pullup</text><text x="300" y="238" fill="#5f5f5f">half scale, most sensitive</text><text x="300" y="282" fill="#1a1a1a">V = 3.3 V × R_FSR ÷ (R_FSR + R_pullup)</text></g><text x="24" y="350" font-size="14" font-weight="600" fill="#1a1a1a">Each pull-up is most sensitive where R_FSR equals it</text><text x="24" y="372" font-size="12" fill="#5f5f5f">ADC count</text><g><g><line x1="80" x2="520" y1="560" y2="560" stroke="#d4d4d4"></line><text x="72" y="564" text-anchor="end" font-size="12" fill="#5f5f5f">0</text></g><g><line x1="80" x2="520" y1="380" y2="380" stroke="#d4d4d4"></line><text x="72" y="384" text-anchor="end" font-size="12" fill="#5f5f5f">4095</text></g><g><line x1="80" x2="80" y1="380" y2="560" stroke="#d4d4d4"></line><text x="80" y="578" text-anchor="middle" font-size="12" fill="#5f5f5f">100 Ω</text></g><g><line x1="226.66666666666666" x2="226.66666666666666" y1="380" y2="560" stroke="#d4d4d4"></line><text x="226.66666666666666" y="578" text-anchor="middle" font-size="12" fill="#5f5f5f">1 kΩ</text></g><g><line x1="373.3333333333333" x2="373.3333333333333" y1="380" y2="560" stroke="#d4d4d4"></line><text x="373.3333333333333" y="578" text-anchor="middle" font-size="12" fill="#5f5f5f">10 kΩ</text></g><g><line x1="520" x2="520" y1="380" y2="560" stroke="#d4d4d4"></line><text x="520" y="578" text-anchor="middle" font-size="12" fill="#5f5f5f">100 kΩ</text></g><line x1="80" x2="520" y1="560" y2="560" stroke="#6b6b6b" stroke-width="1.25"></line></g><text x="300" y="600" text-anchor="middle" font-size="12" fill="#5f5f5f">FSR resistance, log scale (lower = harder press)</text><g><line x1="80" x2="520" y1="470.7692307692308" y2="470.7692307692308" stroke="#6b6b6b" stroke-dasharray="4 4"></line><text x="72" y="474.7692307692308" text-anchor="end" font-size="12" fill="#5f5f5f">2030</text></g><g fill="none"><path d="M80.0 543.6L87.3 541.8L94.7 539.9L102.0 537.7L109.3 535.4L116.7 532.8L124.0 530.1L131.3 527.1L138.7 523.9L146.0 520.4L153.3 516.8L160.7 512.9L168.0 508.7L175.3 504.4L182.7 499.9L190.0 495.2L197.3 490.4L204.7 485.4L212.0 480.3L219.3 475.2L226.7 470.0L234.0 464.8L241.3 459.7L248.7 454.6L256.0 449.6L263.3 444.8L270.7 440.1L278.0 435.6L285.3 431.3L292.7 427.1L300.0 423.2L307.3 419.6L314.7 416.1L322.0 412.9L329.3 409.9L336.7 407.2L344.0 404.6L351.3 402.3L358.7 400.1L366.0 398.2L373.3 396.4L380.7 394.7L388.0 393.2L395.3 391.9L402.7 390.7L410.0 389.6